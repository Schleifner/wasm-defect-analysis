name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shell scripts
        run: bash -n scripts/update_upstreams.sh
      - name: Compile repository helper
        run: python3 -m py_compile scripts/new_run.py